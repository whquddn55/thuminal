[package]
name = "thuminal-daemon"
description = "thuminal 데몬 로직: 세션 관리와 서버. 엔진과 PTY 는 인터페이스로만 안다."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thuminal-protocol.workspace = true
thuminal-engine.workspace = true
thuminal-layout.workspace = true
thuminal-pty.workspace = true
thuminal-workspace.workspace = true
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
thiserror.workspace = true
serde.workspace = true
libc.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
fontdb = "0.24.0"
base64 = "0.22"
# 원격 기기용 브라우저 칸 대리 (browser_proxy.rs): 개발 서버에 붙는 http1 클라이언트 · 업그레이드
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
memchr = "2"
# 붙인 그림 썸네일 (claude 기록의 png · jpeg)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
thuminal-engine-ghostty.workspace = true
thuminal-pty-portable.workspace = true
thuminal-vcs-git.workspace = true
tempfile.workspace = true
