[package]
name = "thuminal-daemon"
description = "thuminal 데몬 로직: 세션 관리와 서버. 엔진과 PTY 는 인터페이스로만 안다."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# 원격 접속 토큰 · 호스트 id 난수 (OS 난수 API. Windows 에는 /dev/urandom 이 없다)
getrandom = "0.3"
dunce.workspace = true
thuminal-protocol.workspace = true
thuminal-ipc.workspace = true
thuminal-engine.workspace = true
thuminal-layout.workspace = true
thuminal-pty.workspace = true
thuminal-workspace.workspace = true
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
thiserror.workspace = true
serde.workspace = true
libc.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
fontdb = "0.24.0"
base64 = "0.22"
# 원격 기기용 브라우저 칸 대리 (browser_proxy.rs): 개발 서버에 붙는 http1 클라이언트 · 업그레이드
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
memchr = "2"
# 이 컴퓨터의 네트워크 주소 (원격 접속이 Tailscale 주소를 찾는다)
if-addrs = "0.15"
# 붙인 그림 썸네일 (claude 기록의 png · jpeg)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# 웹 화면 파일 · 글꼴을 gzip 으로 줄여 보낸다 (폰은 Tailscale 너머라 받는 양이 시작 시간을 정한다)
flate2 = "1"

# macOS 는 ps · lsof 로 읽는다 (procs.rs). 그 밖에서는 프로세스 표와 LISTEN 포트를 이것으로 읽는다
[target.'cfg(not(target_os = "macos"))'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
listeners = "0.6"

[dev-dependencies]
thuminal-engine-ghostty.workspace = true
thuminal-pty-portable.workspace = true
thuminal-vcs-git.workspace = true
tempfile.workspace = true
