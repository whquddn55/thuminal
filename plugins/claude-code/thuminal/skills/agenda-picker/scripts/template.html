<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<script>
  // 그리기 전에 테마를 정해 깜빡이지 않게 한다. 고른 테마는 이 브라우저에 남고, 고른 적이 없으면 시스템 설정을 따른다.
  (function () {
    var t = null;
    try { t = localStorage.getItem('agenda-picker:theme'); } catch (e) { /* 막힌 저장소 */ }
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --line: #e3e3df; --ink: #1d1d1b; --ink2: #444; --ink3: #6f6f6a;
    --accent: #F45084; --accent-soft: #fdebf1; --now: #888; --code-bg: #f0efeb; --warn: #b4530a;
    --font: "Pretendard", "Pretendard Variable", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #151514; --panel: #1f1f1d; --line: #353531; --ink: #ecece9; --ink2: #c9c9c4; --ink3: #95958f;
    --accent-soft: #3b1f2a; --now: #77776f; --code-bg: #2c2c29; --warn: #f0a35c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { font-family: var(--font); margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6; }
  html:has(dialog[open]) { overflow: hidden; }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 28px 72px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; line-height: 1.4; }
  code { font-family: var(--mono); font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
  .muted { color: var(--ink3); }
  .warn { color: var(--warn); font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 14px; font-size: 14px; }
  .btn:hover:not(:disabled) { border-color: var(--ink3); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; padding: 10px 22px; font-size: 15px; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.06); border-color: var(--accent); }

  .rich { font-size: 14px; color: var(--ink2); }
  .rich p { margin: 6px 0 10px; }
  .rich ul, .rich ol { margin: 4px 0 12px; padding-left: 20px; }
  .rich li { margin: 2px 0; }
  .rich > :first-child { margin-top: 0; }
  .rich > :last-child { margin-bottom: 0; }

  .tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; line-height: 1; padding: 4px 8px;
         border-radius: 999px; background: #555; color: #fff; white-space: nowrap; }
  .tag.picked { background: var(--accent); }
  .tag.now { background: var(--now); }
  .tag.rec { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .tag.agreed { background: transparent; color: var(--ink2); box-shadow: inset 0 0 0 1.5px var(--ink3); }
  .tag.undecided { background: transparent; color: var(--ink3); box-shadow: inset 0 0 0 1.5px var(--line); }

  /* 라이트 · 다크 전환 (바닥 · 팝업 · 비교 보기에 하나씩) */
  .seg { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--bg); }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 3px 11px; font-size: 12.5px; font-weight: 600; color: var(--ink3); line-height: 1.5; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  /* ---- 바닥 페이지 */
  .lead { margin: 0 0 18px; }
  .bar { display: flex; align-items: center; gap: 14px; margin: 0 0 16px; font-size: 13px; color: var(--ink3); }
  .meter { flex: 0 0 160px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .meter > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .save { margin-left: auto; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }
  .save.error { color: var(--warn); border-color: currentColor; }
  .banner { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; padding: 10px 14px; border-radius: 10px;
            background: var(--accent-soft); border: 1px solid var(--accent); font-size: 14px; }
  .banner[hidden] { display: none; }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  /* 카드: 제목 (누르면 안건 보기) · 요약 · 안마다 한 줄 (누르면 그 자리에서 고른다, 줄 끝은 그 안으로 안건 보기) */
  .card { padding: 18px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .card.done { border-left: 4px solid var(--accent); padding-left: 17px; }
  .card-head { display: block; color: inherit; text-decoration: none; border-radius: 6px; }
  .card-head:hover .card-title, .card-head:focus-visible .card-title { color: var(--accent); }
  .card-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .card-title { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; line-height: 1.45; transition: color .15s; }
  .num { color: var(--ink3); margin-right: 6px; font-weight: 700; }
  .card-sum { font-size: 13.5px; margin: 0; }
  .hopts { display: grid; gap: 6px; margin-top: 12px; }
  .hopt { display: flex; align-items: stretch; min-width: 0; border: 1px solid var(--line); border-radius: 9px;
          transition: border-color .15s, background .15s; }
  .hopt:hover { border-color: var(--ink3); }
  .hopt.picked { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .hopt-pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; border-radius: 9px;
               padding: 8px 12px; text-align: left; font-size: 14px; font-weight: 600; line-height: 1.45; }
  .hopt-pick:focus-visible, .hopt-view:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .hopt-t { min-width: 0; }
  .hopt-view { flex: none; display: flex; align-items: center; padding: 0 14px; font-size: 13px; text-decoration: none; white-space: nowrap;
               color: #2f6fd6; border-left: 1px solid var(--line); border-radius: 0 9px 9px 0; }
  :root[data-theme="dark"] .hopt-view { color: #7aa7f0; }
  .hopt-view:hover { text-decoration: underline; }
  .card-note { margin-top: 8px; font-size: 13px; color: var(--ink3); }
  .card-memo { margin-top: 8px; font-size: 13px; color: var(--ink2); white-space: pre-wrap; overflow-wrap: anywhere;
               display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .send { margin-top: 28px; padding: 18px 20px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .send label { display: block; font-size: 14px; font-weight: 700; margin: 0 0 6px; }
  textarea { width: 100%; font: inherit; font-size: 14px; color: inherit; background: var(--bg); border: 1px solid var(--line);
             border-radius: 8px; padding: 9px 11px; resize: vertical; line-height: 1.55; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .send-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-top: 14px; }
  .send-info { font-size: 13px; color: var(--ink2); }
  .send-row .btn.primary { flex: none; white-space: nowrap; }
  .send-info > div + div { margin-top: 2px; }

  /* ---- 안건 보기: 머리 한 줄, 가운데 그림 반반 (왼쪽 지금 · 오른쪽 안), 아래 설명 띠 (지금 · 안 두 칸, 세 줄 + 펼치기) */
  dialog::backdrop { background: rgba(18, 18, 16, .55); }
  dialog.cmp { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0;
               background: var(--bg); color: var(--ink); }
  .cmp-in { display: flex; flex-direction: column; height: 100%; }
  .cmp-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .cmp-head h2 { flex: 0 1 auto; max-width: 34vw; min-width: 0; font-size: 15.5px; font-weight: 700; letter-spacing: -0.02em; margin: 0;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmp-head .otabs { flex: 0 1 auto; }
  .cmp-head .sp { flex: 1 0 8px; }
  .cmp-nav { display: flex; align-items: center; gap: 2px; flex: none; font-size: 13px; color: var(--ink3); white-space: nowrap; }
  .cmp-nav button { border: 0; background: none; border-radius: 6px; padding: 0 7px; font-size: 18px; line-height: 1.4; color: var(--ink3); }
  .cmp-nav button:hover:not(:disabled) { color: var(--ink); background: var(--bg); }
  .cmp-nav button:disabled { opacity: .35; cursor: default; }
  .x { border: 0; background: none; font-size: 26px; line-height: 1; padding: 0 4px; color: var(--ink3); }
  .x:hover { color: var(--ink); }

  /* 그림 칸 높이는 fitStage() 가 그림 비율에 맞춰 정한다. 설명 띠는 내용 높이다. 둘이 화면을 넘으면 같이 줄고 (설명은 칸 안 스크롤), 남으면 아래가 빈다 */
  .cmp-stage { position: relative; flex: 0 1 auto; height: 60vh; min-height: 120px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
               gap: 10px; padding: 10px 12px 0; }
  .cmp-stage:focus { outline: none; }
  .cmp-stage.no-left { grid-template-columns: minmax(0, 1fr); }
  .cmp-stage.no-left .pane.left { display: none; }
  .pane { --lab: 34px; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--panel);
          border: 1px solid var(--line); border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
  .pane.picked, .cell.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  /* 표 (지금 · A 안 · 그림 이름 · 그림 번호) 는 그림 위 머리 줄이다. 그림 위에 얹으면 그림 제목을 가린다 */
  .pane-label { position: absolute; top: 0; left: 0; right: 0; height: var(--lab); z-index: 2; display: flex; align-items: center; gap: 8px;
                padding: 0 10px; border-bottom: 1px solid var(--line); pointer-events: none; font-size: 12.5px; }
  .pane-label .cap, .pane-label .count { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pane-label .cap { font-weight: 600; }
  .pane-label .count { margin-left: auto; flex: none; color: var(--ink3); }
  .pane-shot { position: absolute; inset: var(--lab) 0 0 0; display: flex; align-items: flex-start; justify-content: center; overflow: hidden;
               cursor: zoom-in; touch-action: none; user-select: none; -webkit-user-select: none; }
  .pane-shot .media { display: block; max-width: 100%; max-height: 100%; transform-origin: 0 0; -webkit-user-drag: none; }
  /* HTML 그림: 칸 너비로 그리고 내용이 칸보다 길 때만 줄인다 (layoutFrame). 누르기 · 끌기는 칸이 받는다 */
  .pane-shot .media.frame { position: relative; overflow: hidden; max-width: none; max-height: none; flex: none; }
  .media.frame iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; pointer-events: none; background: transparent; }
  .cmp.zoomed .pane-shot { cursor: grab; }
  .cmp.dragging .pane-shot { cursor: grabbing; }
  .noimg { position: absolute; inset: var(--lab) 0 0 0; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center;
           font-size: 14px; color: var(--ink3); line-height: 1.6; background: var(--bg); }
  .zstep { position: absolute; top: calc(50% + var(--lab) / 2); transform: translateY(-50%); z-index: 3; width: 40px; height: 40px; border-radius: 50%;
           border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 20px; line-height: 1;
           box-shadow: 0 2px 8px rgba(0,0,0,.15); opacity: .9; }
  .zstep:hover:not(:disabled) { opacity: 1; border-color: var(--ink3); }
  .zstep:disabled { opacity: .3; cursor: default; }
  .zstep.prev { left: 8px; } .zstep.next { right: 8px; }
  .zoom-hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 4; pointer-events: none;
               padding: 5px 12px; border-radius: 999px; background: rgba(29,29,27,.82); color: #fff; font-size: 12.5px; white-space: nowrap; }
  .zoom-hint[hidden] { display: none; }

  .band { flex: 0 1 auto; min-height: 168px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 10px 12px 12px; }
  .band.open { min-height: 50vh; }
  .band.no-left { grid-template-columns: minmax(0, 1fr); }
  .band.no-left .cell.now { display: none; }
  .cell { display: flex; gap: 14px; min-width: 0; min-height: 0; padding: 10px 14px 8px; background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
  .cell.now { background: transparent; border-style: dashed; }
  .cell-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: auto; overscroll-behavior: contain; }
  .cell h3 { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.02em; margin: 0; line-height: 1.45; }
  .cell h3 > span:last-child { min-width: 0; }
  /* 설명은 접지 않는다. 띠 높이를 넘으면 칸 안에서 스크롤한다 */
  .cell .rich { font-size: 13.5px; margin-top: 4px; }
  .more-btn { align-self: flex-start; border: 0; background: none; padding: 3px 0 0; font-size: 13px; color: #2f6fd6; }
  :root[data-theme="dark"] .more-btn { color: #7aa7f0; }
  .more-btn:hover { text-decoration: underline; }
  .more-btn[hidden] { display: none; }
  .more { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .band.open .more { display: block; }
  .more-lbl { display: block; font-size: 13px; font-weight: 700; color: var(--ink2); margin: 0 0 4px; }
  .more-sec + .more-sec { margin-top: 12px; }
  .more .memo { min-height: 64px; font-size: 13.5px; padding: 6px 10px; }
  .more .keys { margin-top: 10px; font-size: 12px; color: var(--ink3); }
  .agreed-note { color: var(--ink2); padding-left: 10px; border-left: 3px solid var(--ink3); margin-bottom: 6px; font-size: 13.5px; }
  .cell-act { flex: none; display: flex; flex-direction: column; gap: 8px; width: 150px; }
  .cell-act .btn { width: 100%; }
  .pick-btn { border: 1.5px solid var(--accent); color: var(--accent); background: transparent; border-radius: 8px;
              padding: 8px 14px; font-size: 14.5px; font-weight: 700; }
  .pick-btn:hover { background: var(--accent-soft); }
  .pick-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }

  /* 안 바꾸기 버튼 (← → 는 그림만 넘기고, 안은 여기서 바꾼다) */
  .otabs { display: flex; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .otab { display: inline-flex; align-items: center; gap: 6px; flex: 0 1 auto; min-width: 0; max-width: 260px;
          border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 4px 10px 4px 5px;
          font-size: 13px; font-weight: 600; color: var(--ink2); }
  .otab:hover { border-color: var(--ink3); }
  .otab-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .otab small { flex: none; font-size: 11px; font-weight: 700; }
  .otab .rec { color: var(--accent); } .otab .agr { color: var(--ink3); }
  .otab.viewing { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .otab.picked { border-color: var(--accent); }
  .otab.picked.viewing { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

  kbd { font-family: var(--mono); font-size: 11px; padding: 0 4px; border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 4px; background: var(--bg); color: var(--ink2); }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
           background: #1d1d1b; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; z-index: 10;
           transition: opacity .2s, transform .2s; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .toast.on { opacity: 1; transform: translateX(-50%); }
  .toast.bad { background: #8a2b0c; }

  @media (max-width: 1100px) { .cmp-head h2 { max-width: 22vw; } }
  @media (max-width: 760px) {
    .send-row { flex-direction: column; align-items: stretch; }
    .cmp-head { flex-wrap: wrap; }
    .cmp-head h2 { max-width: none; flex-basis: 100%; }
    .cmp-stage { grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(0, 1fr); height: 60vh !important; }
    .band { grid-template-columns: minmax(0, 1fr); }
    .cell-act { width: 120px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div id="lead" class="lead rich"></div>
  <div class="bar">
    <span id="progress"></span><span class="meter"><i id="meter"></i></span><span id="save" class="save"></span>
    <div class="seg" role="group" aria-label="화면 테마"><button type="button" data-set-theme="light">라이트</button><button type="button" data-set-theme="dark">다크</button></div>
  </div>
  <div id="banner" class="banner" hidden></div>
  <ol id="list" class="list"></ol>
  <section class="send">
    <label for="note">전체 메모</label>
    <textarea id="note" rows="3" placeholder="안건 전체에 덧붙일 말이 있으면 적는다 (선택)"></textarea>
    <div class="send-row">
      <div id="send-info" class="send-info"></div>
      <button type="button" id="send" class="btn primary">Claude 로 보내기</button>
    </div>
  </section>
</main>

<dialog id="cmp" class="cmp" aria-labelledby="cmp-title">
  <div class="cmp-in">
    <header class="cmp-head">
      <h2 id="cmp-title"></h2>
      <nav id="cmp-tabs" class="otabs" aria-label="안 바꾸기"></nav>
      <span class="sp"></span>
      <div class="cmp-nav">
        <button type="button" id="cmp-prev" aria-label="이전 안건">‹</button>
        <span id="cmp-pos"></span>
        <button type="button" id="cmp-hnext" aria-label="다음 안건">›</button>
      </div>
      <div class="seg" role="group" aria-label="화면 테마"><button type="button" data-set-theme="light">라이트</button><button type="button" data-set-theme="dark">다크</button></div>
      <button type="button" class="x" data-close aria-label="목록으로">×</button>
    </header>
    <div id="cmp-stage" class="cmp-stage" tabindex="-1" autofocus>
      <section id="cmp-left" class="pane left" aria-label="지금 상태"></section>
      <section id="cmp-right" class="pane right" aria-label="안"></section>
      <div id="zoom-hint" class="zoom-hint" hidden></div>
    </div>
    <div id="band" class="band">
      <section class="cell now"><div class="cell-main"><div id="band-left"></div></div></section>
      <section id="cell-opt" class="cell opt">
        <div class="cell-main">
          <div id="band-right"></div>
          <div class="more">
            <div id="band-ctx"></div>
            <div class="more-sec"><label class="more-lbl" for="memo">이 안건 메모</label>
              <textarea id="memo" class="memo" rows="3" placeholder="고른 안에 덧붙일 조건이나 다른 의견 (선택)"></textarea></div>
            <div class="keys"><kbd>←</kbd><kbd>→</kbd> 그림 · <kbd>A</kbd><kbd>B</kbd>… 안 바꾸기 · <kbd>Enter</kbd> 이 안으로 하고 다음 안건 ·
              그림을 누르면 양쪽 같은 자리를 2배로 (휠 배율 · 끌어 옮기기 · <kbd>Esc</kbd> 원래대로)</div>
          </div>
          <button type="button" class="more-btn" data-more></button>
        </div>
        <div class="cell-act">
          <button type="button" id="cmp-pickbtn" class="pick-btn" data-pick="" aria-pressed="false">이 안으로</button>
          <button type="button" id="cmp-next" class="btn">다음 안건 →</button>
        </div>
      </section>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="application/json" id="spec-data">@@SPEC@@</script>
<script type="application/json" id="state-data">@@STATE@@</script>
<script type="application/json" id="config-data">@@CONFIG@@</script>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const readJSON = id => JSON.parse(byId(id).textContent);
  const spec = readJSON('spec-data');
  const cfg = readJSON('config-data');
  const agendas = spec.agendas;
  const LS = 'agenda-picker:' + cfg.dirKey;
  const THEME_LS = 'agenda-picker:theme';
  const serverMode = cfg.mode === 'server' && /^https?:$/.test(location.protocol);
  const cmpDlg = byId('cmp');

  // ---------------------------------------------------------------- 상태
  const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
  const strMap = m => Object.fromEntries(Object.entries(isObj(m) ? m : {}).filter(([, v]) => typeof v === 'string'));
  const clean = s => {
    s = isObj(s) ? s : {};
    return { version: 1, updatedAt: typeof s.updatedAt === 'string' ? s.updatedAt : '',
             picks: strMap(s.picks), memos: strMap(s.memos), note: typeof s.note === 'string' ? s.note : '',
             seeded: strMap(s.seeded) };
  };
  const loadLocal = () => { try { return clean(JSON.parse(localStorage.getItem(LS) || 'null')); } catch (e) { return clean(null); } };
  const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) { /* 사생활 보호 모드 등 */ } };

  let state = clean(readJSON('state-data'));
  // ver 는 바뀔 때마다 1 씩 오르고, savedVer 는 서버가 받은 마지막 ver 다. 둘이 다르면 아직 파일에 안 쓰였다.
  let ver = 0, savedVer = 0;
  const unsaved = () => serverMode && ver !== savedVer;
  {
    // 서버에 못 보낸 채 닫힌 변경이 이 브라우저에 남아 있으면 그쪽을 쓴다.
    const local = loadLocal();
    if (local.updatedAt && local.updatedAt > state.updatedAt) { state = local; ver = 1; }
  }

  // 대화에서 이미 정한 안(decided) 을 미리 골라 둔다. 같은 값은 한 번만 넣으므로 사용자가 페이지에서 바꾸거나 푼 것은
  // 다시 덮지 않는다. Claude 가 decided 를 다른 값으로 고치면 (대화에서 새로 정했으면) 그 값으로 다시 맞춘다.
  const decidedOf = ag => (typeof ag.decided === 'string' && ag.options.some(o => o.id === ag.decided)) ? ag.decided : '';
  let seededNow = false;
  agendas.forEach(ag => {
    const dv = decidedOf(ag);
    if (dv && state.seeded[ag.id] !== dv) { state.picks[ag.id] = dv; state.seeded[ag.id] = dv; seededNow = true; }
  });

  // ---------------------------------------------------------------- 도우미
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');   // 제목은 평문, `식별자` 만 코드 칩
  const agById = id => agendas.find(a => a.id === id);
  const pickOf = ag => ag.options.find(o => o.id === state.picks[ag.id]) || null;
  const optTag = (op, picked) => `<span class="tag${picked ? ' picked' : ''}">${esc(op.id)}</span>`;
  const recTag = op => op.recommended ? '<span class="tag rec">권장</span>' : '';
  const agreedTag = (ag, op) => op && decidedOf(ag) === op.id ? '<span class="tag agreed">대화에서 정함</span>' : '';
  const fmtTime = iso => { const t = new Date(iso); return isNaN(t) ? '' : t.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }); };

  let toastTimer = 0;
  function toast(msg, bad) {
    const t = byId('toast');
    t.textContent = msg; t.classList.toggle('bad', !!bad); t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 3800);
  }

  // ---------------------------------------------------------------- 테마 · 그림
  // 그림 한 항목은 {light, dark} 쌍이거나 src 하나다. 페이지 테마에 맞는 쪽 하나만 보이고, 없는 쪽은 있는 쪽으로 대신한다.
  const theme = () => document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  const shotsOf = b => (b && Array.isArray(b.shots) ? b.shots : []).map(s => {
    if (typeof s === 'string') s = { src: s };
    if (!isObj(s)) return null;
    const l = s.light || s.src || s.dark || '', d = s.dark || s.src || s.light || '';
    const [w, h] = String(s.size || '').split('x').map(Number);   // HTML 그림의 비율 (선택, "1200x460"). 정적 사본에서만 쓴다
    if (isObj(s.figure)) return { fig: s.figure, l: '', d: '', caption: s.caption || '', w: 0, h: 0 };
    return l ? { l, d, caption: s.caption || '', w: w || 0, h: h || 0 } : null;
  }).filter(Boolean);
  // 영상(mp4 · webm · mov · m4v)은 소리 없이 반복 재생한다.
  const isVideo = src => /\.(mp4|webm|mov|m4v)$/i.test(String(src).split(/[?#]/)[0]);
  // HTML(.html · .htm) 그림은 스크린샷 대신 iframe 으로 바로 그린다. 칸의 실제 너비로 그려 글자가 원래 크기이고, 높이는
  // 그 너비에서 잰 내용 높이다. 스크립트는 막고 (sandbox), 같은 origin 이라 페이지가 높이를 재고 테마를 넘긴다.
  // 서버도 .html 에 CSP sandbox 를 붙여, 주소로 바로 열어도 스크립트가 돌지 않는다.
  const isFrame = src => /\.html?$/i.test(String(src).split(/[?#]/)[0]);
  // 그림 데이터 (figure) 를 HTML 문서로 만든다. Claude 는 줄 · 상자 (그래프) 나 본문 조각 (자유) 만 적고, 틀과 공통 스타일
  // (references/diagram/base.css, 서버가 cfg.figCss 로 넘긴다) 은 여기서 붙인다. 토큰을 아끼려는 것이다.
  //   {"title", "lanes": [{"who", "nodes": ["글|작은 글", {"t", "s", "k": "new|warn|muted"}]}], "html", "css", "note"}
  function figureDoc(f) {
    const node = n => {
      if (typeof n === 'string') { const [t, sub] = n.split('|'); n = { t, s: sub }; }
      const k = ['new', 'warn', 'muted'].includes(n.k) ? ' ' + n.k : '';
      return `<div class="node${k}">${inline(n.t || '')}${n.s ? `<small>${inline(n.s)}</small>` : ''}</div>`;
    };
    const lanes = Array.isArray(f.lanes) ? f.lanes.map(ln => {
      const who = ln && ln.who ? `<div class="who">${inline(ln.who)}</div>` : '';
      return `<div class="lane${who ? '' : ' solo'}">${who}<div class="row">${(ln && Array.isArray(ln.nodes) ? ln.nodes : []).map(node).join('')}</div></div>`;
    }).join('') : '';
    return `<!doctype html><html data-theme="${theme()}"><head><meta charset="utf-8"><style>${cfg.figCss || ''}\n${f.css || ''}</style></head><body>` +
           (f.title ? `<h1>${inline(f.title)}</h1>` : '') + lanes + (f.html || '') + (f.note ? `<p class="note">${f.note}</p>` : '') + '</body></html>';
  }
  const img = (s, attrs) => {
    const src = theme() === 'dark' ? s.d : s.l;
    if (s.fig) {
      return `<div class="media frame" data-fig="1" data-sw="" data-sh="">` +
             `<iframe srcdoc="${esc(figureDoc(s.fig))}" sandbox="allow-same-origin" tabindex="-1" scrolling="no" title="${esc(s.caption || s.fig.title || '그림')}"></iframe></div>`;
    }
    if (isFrame(s.l)) {
      return `<div class="media frame" data-l="${esc(s.l)}" data-d="${esc(s.d)}" data-sw="${s.w || ''}" data-sh="${s.h || ''}">` +
             `<iframe src="${esc(src)}" sandbox="allow-same-origin" tabindex="-1" scrolling="no" title="${esc(s.caption || '그림')}"></iframe></div>`;
    }
    const head = `class="media" src="${esc(src)}" data-l="${esc(s.l)}" data-d="${esc(s.d)}" ${attrs || ''}`;
    return isVideo(s.l) ? `<video ${head} muted loop autoplay playsinline preload="auto"></video>` : `<img ${head}>`;
  };
  const frameDoc = fr => { try { return fr.contentDocument && fr.contentDocument.documentElement ? fr.contentDocument : null; } catch (e) { return null; } };
  // 그림 문서의 <html> 에 data-theme 을 단다. 그림 HTML 은 :root[data-theme="dark"] 로 다크 색을 쓴다.
  const themeFrame = fr => { const doc = frameDoc(fr); if (doc) { doc.documentElement.dataset.theme = theme(); doc.documentElement.style.colorScheme = theme(); } };
  // 너비 w 로 그렸을 때의 내용 높이. iframe 높이를 1 로 줄여야 문서 높이가 칸 높이가 아니라 내용 높이로 나온다.
  // 문서를 못 읽으면 (file:// 로 연 정적 사본) size 의 비율, 그것도 없으면 너비의 절반으로 둔다.
  function frameHeight(box, w) {
    const fr = box.firstElementChild, doc = frameDoc(fr);
    if (doc && doc.body) {
      fr.width = w; fr.height = 1;
      const h = Math.ceil(Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight));
      fr.height = h;
      if (h > 1) return h;
    }
    const sw = +box.dataset.sw, sh = +box.dataset.sh;
    return Math.round(sw && sh ? w * sh / sw : w / 2);
  }
  // fitStage 가 칸 높이를 정할 때 쓰는 크기 (칸 너비, 그 너비에서의 높이).
  const frameNat = (box, w) => [w, frameHeight(box, w)];
  // 칸 (pane-shot) 너비로 그리고, 내용이 칸보다 길면 그만큼만 줄인다.
  function layoutFrame(box) {
    const ps = box.parentElement, fr = box.firstElementChild;
    if (!ps || !fr || !ps.clientWidth) return;
    const w = ps.clientWidth, h = frameHeight(box, w), k = Math.min(1, ps.clientHeight / h);
    box.style.width = w * k + 'px'; box.style.height = h * k + 'px';
    fr.style.transform = k < 1 ? `scale(${k})` : '';
  }

  function paintTheme() {
    const t = theme();
    document.querySelectorAll('[data-set-theme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.setTheme === t)));
    document.querySelectorAll('.media.frame[data-fig] iframe').forEach(themeFrame);
    document.querySelectorAll('.media[data-l]').forEach(el => {
      const src = t === 'dark' ? el.dataset.d : el.dataset.l;
      const tgt = el.classList.contains('frame') ? el.firstElementChild : el;
      if (tgt.getAttribute('src') !== src) tgt.setAttribute('src', src);
      else if (tgt !== el) themeFrame(tgt);   // 테마마다 같은 HTML 이면 문서에 테마만 넘긴다
    });
  }
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem(THEME_LS, t); } catch (e) { /* 막힌 저장소 */ }
    paintTheme();
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-set-theme]');
    if (b) setTheme(b.dataset.setTheme);
  });

  // ---------------------------------------------------------------- 저장
  let online = serverMode, saveErr = null, timer = 0, inflight = null, again = false;

  function setSave() {
    const el = byId('save');
    let text, bad = false;
    if (!serverMode) text = '이 브라우저에만 저장';
    else if (saveErr && saveErr.status === 403) { text = '페이지가 오래됐다 · 새로고침'; bad = true; }
    else if (!online) { text = '서버 꺼짐 · 이 브라우저에 임시 저장'; bad = true; }
    else if (saveErr) { text = '저장 실패 · ' + saveErr.message; bad = true; }
    else if (unsaved()) text = '저장 중…';
    else text = '저장됨 · selections.json';
    el.textContent = text; el.classList.toggle('error', bad);
  }

  async function api(method, path, body, extra) {
    const opts = Object.assign({ method, cache: 'no-store', headers: { 'X-Picker-Token': cfg.token } }, extra || {});
    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const r = await fetch(path, opts);
    let data = null;
    try { data = await r.json(); } catch (e) { /* 본문 없음 */ }
    if (!r.ok) { const err = new Error((data && data.message) || ('HTTP ' + r.status)); err.status = r.status; throw err; }
    return data;
  }

  function touch(delay) {
    state.updatedAt = new Date().toISOString();
    ver++;
    saveLocal();
    setSave();
    clearTimeout(timer);
    if (serverMode) timer = setTimeout(flush, delay || 0);
  }

  async function flush() {
    clearTimeout(timer); timer = 0;
    if (!unsaved()) return;
    if (inflight) { again = true; return; }
    const v = ver;
    inflight = (async () => {
      try { await api('PUT', '/api/state', state); savedVer = Math.max(savedVer, v); saveErr = null; online = true; }
      catch (e) { saveErr = e.status ? e : null; if (!e.status) online = false; }
    })();
    await inflight; inflight = null; setSave();
    if (again) { again = false; flush(); }
  }

  window.addEventListener('pagehide', () => {
    if (!unsaved()) return;
    try {
      fetch('/api/state', { method: 'PUT', keepalive: true,
        headers: { 'X-Picker-Token': cfg.token, 'Content-Type': 'application/json' }, body: JSON.stringify(state) });
    } catch (e) { /* localStorage 에 남아 있어 다음에 다시 올린다 */ }
  });

  // ---------------------------------------------------------------- 바닥 페이지
  function renderHead() {
    byId('title').innerHTML = inline(spec.title);
    if (spec.lead) byId('lead').innerHTML = spec.lead; else byId('lead').remove();
    byId('note').value = state.note;
  }

  // 카드마다 안을 한 줄씩 늘어놓아 바닥에서 바로 고른다 (다시 누르면 푼다). 그림을 견주려면 줄 끝 링크로 그 안을 연 안건 보기에 들어간다.
  const hasShots = ag => !!(shotsOf(ag.current).length || ag.options.some(o => shotsOf(o).length));
  function renderList() {
    byId('list').innerHTML = agendas.map((ag, i) => {
      const op = pickOf(ag), dv = decidedOf(ag), href = '#' + encodeURIComponent(ag.id);
      const memo = (state.memos[ag.id] || '').trim();
      const view = hasShots(ag) ? '그림 비교 →' : '자세히 →';
      const rows = ag.options.map((o, j) => {
        const on = !!op && op.id === o.id;
        return `<div class="hopt${on ? ' picked' : ''}">
          <button type="button" class="hopt-pick" data-hpick="${esc(o.id)}" aria-pressed="${on}">${optTag(o, on)}<span class="hopt-t">${inline(o.title)}</span>${recTag(o)}${dv === o.id ? '<span class="tag agreed">대화에서 정함</span>' : ''}</button>
          <a class="hopt-view" href="${href}" data-view="${j}">${view}</a></div>`;
      }).join('');
      const note = dv && (!op || op.id !== dv) ? `<div class="card-note">대화에서는 ${esc(dv)} 로 정했다${op ? '' : ' (지금은 풀었다)'}.</div>` : '';
      return `<li><div class="card${op ? ' done' : ''}" data-ag="${esc(ag.id)}">
        <a class="card-head" href="${href}"><h2 class="card-title"><span class="num">${i + 1}.</span>${inline(ag.title)}</h2></a>
        ${ag.summary ? `<div class="card-sum rich">${ag.summary}</div>` : ''}
        <div class="hopts" role="group" aria-label="안 고르기">${rows}</div>
        ${note}
        ${memo ? `<div class="card-memo">메모: ${esc(memo)}</div>` : ''}
      </div></li>`;
    }).join('');
    const done = agendas.filter(pickOf).length;
    const agreed = agendas.filter(ag => { const op = pickOf(ag); return op && op.id === decidedOf(ag); }).length;
    byId('progress').textContent = `결정 ${done} / ${agendas.length}` + (agreed ? ` · 대화에서 정함 ${agreed}` : '');
    byId('meter').style.width = (agendas.length ? done / agendas.length * 100 : 0) + '%';
    renderSend();
  }

  let meta = null;
  function renderSend() {
    const lines = [];
    const undecided = agendas.filter(a => !pickOf(a)).length;
    lines.push(undecided ? `<span class="warn">미정 ${undecided}건</span>` : '모든 안건을 골랐다.');
    const live = serverMode && online;
    if (live && meta) {
      const ls = meta.lastSent;
      if (ls) {
        const dl = meta.delivery && meta.delivery.seq === ls.seq ? meta.delivery : null;
        if (dl && dl.pending) {
          lines.push(`#${ls.seq} 을 ${fmtTime(ls.sentAt)} 에 보냈다. Claude 입력창에 넣는 중이다.`);
        } else if (dl && !dl.ok && meta.consumed < ls.seq) {
          lines.push(`<span class="warn">#${ls.seq} 을 ${fmtTime(ls.sentAt)} 에 보냈지만 Claude 에 넣지 못했다.</span> ${esc(dl.message)}`);
        } else {
          const got = meta.consumed >= ls.seq;
          lines.push(`#${ls.seq} 을 ${fmtTime(ls.sentAt)} 에 보냈다. ${got ? (dl && dl.ok ? (dl.via === 'inbox' ? 'Claude 세션에 바로 넣었다.' : 'Claude 입력창에 넣었다.') : 'Claude 에 전달됐다.') : 'Claude 에 아직 전달되지 않았다.'}`);
        }
        if (state.updatedAt > (ls.stateUpdatedAt || '')) lines.push('<span class="warn">보낸 뒤 바뀐 선택이 있다.</span>');
      }
      if (!meta.waiter) lines.push('<span class="muted">Claude 가 지금 받을 준비가 안 돼 있다. 보내 두면 Claude 가 다시 기다릴 때 전달된다.</span>');
    }
    if (!serverMode) lines.push(`<span class="muted">파일로 연 페이지라 바로 보낼 수 없다. 버튼은 메시지를 클립보드에 복사한다. 서버가 떠 있으면 <code>http://127.0.0.1:${esc(cfg.port)}/</code> 에서 연다.</span>`);
    else if (!online) lines.push('<span class="muted">서버가 꺼져 있다. 버튼은 메시지를 클립보드에 복사한다.</span>');
    byId('send-info').innerHTML = lines.map(l => `<div>${l}</div>`).join('');
    byId('send').textContent = live ? 'Claude 로 보내기' : '메시지 복사';
  }

  function showBanner(html) {
    const b = byId('banner');
    b.innerHTML = html; b.hidden = false;
  }

  byId('note').addEventListener('input', e => { state.note = e.target.value; touch(400); renderSend(); });
  let wantOpt = null;   // 줄 끝 링크로 들어가면 그 안을 먼저 보인다
  byId('list').addEventListener('click', e => {
    const b = e.target.closest('[data-hpick]');
    if (b) {
      const agId = b.closest('.card').dataset.ag, oid = b.dataset.hpick;
      setPick(agId, oid);
      const again = document.querySelector(`.card[data-ag="${CSS.escape(agId)}"] [data-hpick="${CSS.escape(oid)}"]`);
      if (again) again.focus();   // 다시 그려도 키보드 자리를 잃지 않게
      return;
    }
    const v = e.target.closest('[data-view]');
    if (v) wantOpt = +v.dataset.view;
  });
  byId('banner').addEventListener('click', async e => {
    if (e.target.closest('[data-reload]')) { await flush(); location.reload(); }
  });

  // ---------------------------------------------------------------- 안건 보기
  // 카드를 누르면 열린다 (주소 #안건id). 머리 한 줄 (제목 · 안 버튼 · 안건 n/m · 테마 · ×), 가운데 그림 반반 (왼쪽 지금, 오른쪽 안),
  // 아래 설명 띠 (지금 · 안 두 칸, 세 줄 + 펼치기). ← → 는 그림만 넘기고 (양쪽 같이), 안은 안 버튼이나 A · B · C 키로 바꾼다.
  // 그림을 누르면 양쪽 그림의 같은 자리를 같이 2배로 키운다 (휠 배율, 끌어 옮기기도 양쪽이 같이). Esc 나 다시 누르면 원래대로.
  let cmp = null;   // { ag, oi: 보는 안 번호, step: 그림 번호 }
  let bandOpen = false;
  // 확대: s 배율, x · y 는 그림 크기에 대한 비율로 잰 이동. 두 그림에 같은 값을 쓰므로 크기가 달라도 같은 자리가 같은 곳에 온다.
  const zoom = { s: 1, x: 0, y: 0 };
  const ZMAX = 8;

  // 지금 그림과 안 그림의 짝. 모든 그림에 caption 이 있으면 이름으로 (지금 "목록" ↔ A "목록"), 아니면 순서로 맞춘다.
  // 한쪽에 짝이 없으면 그 칸은 비우고 사유를 적는다 (다른 그림을 대신 보이면 짝인 것처럼 보이기 때문이다).
  function model() {
    const ag = cmp.ag, op = ag.options[cmp.oi], L = shotsOf(ag.current), R = shotsOf(op), all = L.concat(R);
    let steps;
    if (all.length && all.every(s => s.caption)) {
      const caps = [];
      all.forEach(s => { if (!caps.includes(s.caption)) caps.push(s.caption); });
      steps = caps.map(cap => ({ cap, l: L.find(s => s.caption === cap) || null, r: R.find(s => s.caption === cap) || null }));
    } else {
      steps = Array.from({ length: Math.max(L.length, R.length, 1) }, (_, i) => ({ cap: '', i, l: L[i] || null, r: R[i] || null }));
    }
    return { ag, op, L, R, steps, st: steps[Math.min(cmp.step, steps.length - 1)] };
  }

  const missing = (m, side) => {
    const st = m.st;
    if (side === 'L') {
      if (!m.L.length) return '지금 상태 그림이 없다';
      return st.cap ? `지금 상태에는 '${esc(st.cap)}' 그림이 없다` : `지금 상태 그림은 ${m.L.length}장뿐이다`;
    }
    if (!m.R.length) return `${esc(m.op.id)} 안은 그림이 없다.<br>아래 설명을 본다.`;
    return st.cap ? `${esc(m.op.id)} 안에는 '${esc(st.cap)}' 그림이 없다` : `${esc(m.op.id)} 안 그림은 ${m.R.length}장뿐이다`;
  };

  function openCompare(ag) {
    let oi = wantOpt != null && ag.options[wantOpt] ? wantOpt : ag.options.findIndex(o => o.id === state.picks[ag.id]);
    wantOpt = null;
    if (oi < 0) oi = ag.options.findIndex(o => o.recommended);
    cmp = { ag, oi: Math.max(oi, 0), step: 0 };
    bandOpen = false;
    resetZoom(true);
    byId('memo').value = state.memos[ag.id] || '';
    paintCompare();
    if (!cmpDlg.open) cmpDlg.showModal();
    byId('cmp-stage').focus({ preventScroll: true });
  }

  const optTabs = (ag, oi) => ag.options.map((o, i) =>
    `<button type="button" class="otab${i === oi ? ' viewing' : ''}" data-opt="${i}" title="${esc(o.id + '. ' + o.title)}">` +
    `<span class="tag">${esc(o.id)}</span><span class="otab-t">${inline(o.title)}</span>` +
    `${o.recommended ? '<small class="rec">권장</small>' : ''}${decidedOf(ag) === o.id ? '<small class="agr">정함</small>' : ''}</button>`).join('');

  function paintCompare() {
    const c = cmp;
    if (!c) return;
    const m = model(), ag = m.ag, i = agendas.indexOf(ag);
    c.step = Math.min(c.step, m.steps.length - 1);
    byId('cmp-title').innerHTML = `<span class="num">${i + 1}.</span>${inline(ag.title)}`;
    byId('cmp-title').title = ag.title;
    byId('cmp-tabs').innerHTML = optTabs(ag, c.oi);
    byId('cmp-pos').textContent = `안건 ${i + 1} / ${agendas.length}`;
    byId('cmp-prev').disabled = i === 0;
    byId('cmp-hnext').disabled = i === agendas.length - 1;
    byId('cmp-next').textContent = i === agendas.length - 1 ? '목록으로' : '다음 안건 →';
    paintStage(m);
    paintBand(m);
    syncPicks();
    fitStage();
    applyZoom();
    // 누른 버튼이 다시 그려져 사라졌으면 키보드가 계속 먹게 포커스를 옮긴다.
    if (cmpDlg.open && !cmpDlg.contains(document.activeElement)) byId('cmp-stage').focus({ preventScroll: true });
  }

  const stepBtn = (m, dir) => {
    if (m.steps.length < 2) return '';
    const off = dir < 0 ? cmp.step === 0 : cmp.step === m.steps.length - 1;
    return `<button type="button" class="zstep ${dir < 0 ? 'prev' : 'next'}" data-step="${dir}" aria-label="${dir < 0 ? '이전' : '다음'} 그림"${off ? ' disabled' : ''}>${dir < 0 ? '‹' : '›'}</button>`;
  };
  const capOf = (s, st) => esc((s && s.caption) || st.cap || '');

  function paintStage(m) {
    const ag = m.ag, st = m.st, hasLeft = !!ag.current;
    byId('cmp-stage').className = 'cmp-stage' + (hasLeft ? '' : ' no-left');
    const shot = (s, side) => s
      ? `<div class="pane-shot" data-zoom="${side}" title="누르면 양쪽 같은 자리를 2배로">${img(s, 'alt="" draggable="false"')}</div>`
      : `<div class="noimg">${missing(m, side)}</div>`;
    const label = (chip, s) => {
      const cap = capOf(s, m.st);
      return `<div class="pane-label">${chip}${cap ? `<span class="cap">${cap}</span>` : ''}` +
             `${m.steps.length > 1 ? `<span class="count">그림 ${cmp.step + 1} / ${m.steps.length}</span>` : ''}</div>`;
    };
    byId('cmp-left').innerHTML = hasLeft
      ? label('<span class="tag now">지금</span>', st.l) + shot(st.l, 'L') + stepBtn(m, -1)
      : '';
    byId('cmp-right').innerHTML = label(`<span class="tag" data-optchip>${esc(m.op.id)} 안</span>`, st.r) + shot(st.r, 'R')
      + (hasLeft ? '' : stepBtn(m, -1)) + stepBtn(m, 1);
    byId('cmp-right').dataset.key = m.op.id;
  }

  // 그림 칸 높이를 보이는 그림 중 가장 세로로 긴 것에 맞춘다 (칸 너비 × 그림 비율 + 머리 줄). 그림이 아직 안 떴으면
  // 임시 높이로 두고, 뜨면 (load · loadedmetadata) 다시 맞춘다. 화면이 모자라면 flex 가 줄이고 그림은 칸 안에 맞춰 작아진다.
  function fitStage() {
    const st = byId('cmp-stage');
    if (!cmp || matchMedia('(max-width: 760px)').matches) return;
    let need = 0;
    st.querySelectorAll('.pane').forEach(p => {
      if (!p.offsetWidth) return;
      const lab = p.querySelector('.pane-label'), m = p.querySelector('.pane-shot .media');
      const [nw, nh] = !m ? [0, 0] : m.classList.contains('frame') ? frameNat(m, p.clientWidth) : [m.naturalWidth || m.videoWidth, m.naturalHeight || m.videoHeight];
      const body = nw && nh ? p.clientWidth * nh / nw : 220;
      need = Math.max(need, (lab ? lab.offsetHeight : 0) + body);
    });
    st.style.height = Math.ceil(need + 12) + 'px';   // 위 여백 10 + 테두리
  }

  function paintBand(m) {
    const ag = m.ag, op = m.op, dv = decidedOf(ag), band = byId('band');
    band.className = 'band' + (ag.current ? '' : ' no-left') + (bandOpen ? ' open' : '');
    byId('band-left').innerHTML = ag.current
      ? `<h3><span class="tag now">지금</span><span>${inline(ag.current.title || '지금 상태')}</span></h3>` +
        (ag.current.body ? `<div class="rich">${ag.current.body}</div>` : '')
      : '';
    byId('band-right').innerHTML =
      `<h3><span class="tag" data-optchip>${esc(op.id)}</span>${recTag(op)}${agreedTag(ag, op)}<span>${inline(op.title)}</span></h3>` +
      (op.body ? `<div class="rich">${op.body}</div>` : '');
    byId('cell-opt').dataset.key = op.id;
    byId('cmp-pickbtn').dataset.pick = op.id;
    const ctx = (dv ? `<div class="agreed-note"><b>대화에서 정한 안 ${esc(dv)} 를 미리 골라 두었다.</b> ${ag.decidedNote ? inline(ag.decidedNote) + ' ' : ''}바꾸려면 다른 안을 고른다.</div>` : '')
      + (ag.context ? `<div class="rich">${ag.context}</div>` : '');
    byId('band-ctx').innerHTML = ctx ? `<div class="more-sec"><span class="more-lbl">안건 배경</span>${ctx}</div>` : '';
    paintMore();
  }

  // 펼치기 버튼은 안 칸에 하나다. 설명은 늘 다 보이고, 펼치면 안건 배경 · 메모 칸이 나온다.
  function paintMore() {
    if (!cmp) return;
    const ag = cmp.ag, memo = (state.memos[ag.id] || '').trim();
    const rb = byId('band').querySelector('[data-more]');
    const extra = [ag.context || decidedOf(ag) ? '안건 배경' : '', '메모'].filter(Boolean).join(' · ');
    rb.textContent = bandOpen ? '▴ 접기' : `▾ 펼치기 (${extra}${memo ? ' 있음' : ' 포함'})`;
  }

  function setBand(open) {
    bandOpen = open;
    byId('band').classList.toggle('open', open);
    paintMore();
    requestAnimationFrame(applyZoom);   // 띠가 커지면 그림 칸이 줄어 그림 크기도 바뀐다
  }

  // ---- 양쪽 같이 확대
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  function resetZoom(quiet) {
    zoom.s = 1; zoom.x = 0; zoom.y = 0;
    if (!quiet) applyZoom();
  }
  function applyZoom() {
    zoom.s = clamp(zoom.s, 1, ZMAX);
    if (zoom.s <= 1.001) { zoom.s = 1; zoom.x = 0; zoom.y = 0; }
    zoom.x = clamp(zoom.x, 1 - zoom.s, 0);
    zoom.y = clamp(zoom.y, 1 - zoom.s, 0);
    cmpDlg.querySelectorAll('.pane-shot .media.frame').forEach(layoutFrame);
    cmpDlg.querySelectorAll('.pane-shot .media').forEach(im => {
      im.style.transform = zoom.s === 1 ? '' : `translate(${zoom.x * im.offsetWidth}px, ${zoom.y * im.offsetHeight}px) scale(${zoom.s})`;
    });
    const on = zoom.s > 1;
    cmpDlg.classList.toggle('zoomed', on);
    const hint = byId('zoom-hint');
    hint.hidden = !on;
    if (on) hint.textContent = `${zoom.s.toFixed(1)}배 · 휠로 배율 · 끌어서 옮기기 · 누르거나 Esc 로 원래대로`;
  }
  // 그림 위 한 점 (그림 크기에 대한 비율 u · v) 이 화면에서 제자리에 있도록 배율을 바꾼다.
  function zoomAt(s1, u, v) {
    const s0 = zoom.s;
    s1 = clamp(s1, 1, ZMAX);
    zoom.x += (s0 - s1) * clamp(u, 0, 1);
    zoom.y += (s0 - s1) * clamp(v, 0, 1);
    zoom.s = s1;
    applyZoom();
  }
  const pointOn = (im, e) => {
    const r = im.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
  };

  let drag = null;   // { id, x0, y0, zx, zy, im, moved }
  const stage = byId('cmp-stage');
  stage.addEventListener('pointerdown', e => {
    const ps = e.target.closest('.pane-shot');
    if (!ps || e.button !== 0) return;
    const im = ps.querySelector('.media');
    if (!im) return;
    e.preventDefault();
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, zx: zoom.x, zy: zoom.y, im, moved: false };
    ps.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    if (zoom.s === 1) return;
    cmpDlg.classList.add('dragging');
    zoom.x = drag.zx + dx / (drag.im.offsetWidth || 1);
    zoom.y = drag.zy + dy / (drag.im.offsetHeight || 1);
    applyZoom();
  });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    cmpDlg.classList.remove('dragging');
    if (d.moved || e.type === 'pointercancel') return;
    if (zoom.s > 1) return resetZoom();   // 확대 중에 누르면 원래대로
    const [u, v] = pointOn(d.im, e);
    zoomAt(2, u, v);
  };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('wheel', e => {
    const ps = e.target.closest('.pane-shot');
    const im = ps && ps.querySelector('.media');
    if (!im) return;
    e.preventDefault();
    const [u, v] = pointOn(im, e);
    zoomAt(zoom.s * Math.exp(-e.deltaY * 0.0015), u, v);
  }, { passive: false });
  // 테마를 바꾸거나 안을 바꿔 새 그림이 늦게 뜨면 그 크기로 다시 맞춘다.
  const onMedia = e => {
    if (!e.target.closest || !e.target.closest('.pane-shot')) return;
    if (e.target.tagName === 'IFRAME') themeFrame(e.target);
    fitStage(); applyZoom();
  };
  cmpDlg.addEventListener('load', onMedia, true);
  cmpDlg.addEventListener('loadedmetadata', onMedia, true);   // 영상은 load 대신 이것으로 크기를 안다
  window.addEventListener('resize', () => { if (cmp) { fitStage(); applyZoom(); paintMore(); } });

  // 고른 안 표시만 맞춘다 (다시 그리지 않는다).
  function syncPicks() {
    if (!cmp) return;
    const ag = cmp.ag, pid = state.picks[ag.id];
    cmpDlg.querySelectorAll('.otab[data-opt]').forEach(b => {
      const on = ag.options[+b.dataset.opt].id === pid;
      b.classList.toggle('picked', on);
      b.querySelector('.tag').classList.toggle('picked', on);
    });
    const btn = byId('cmp-pickbtn'), on = btn.dataset.pick === pid;
    btn.textContent = on ? '✓ 선택됨' : '이 안으로';
    btn.setAttribute('aria-pressed', String(on));
    cmpDlg.querySelectorAll('[data-key]').forEach(d => d.classList.toggle('picked', d.dataset.key === pid));
    cmpDlg.querySelectorAll('[data-optchip]').forEach(t => t.classList.toggle('picked', cmp.ag.options[cmp.oi].id === pid));
  }

  function setPick(agId, oid) {
    if (!agId) return;
    if (state.picks[agId] === oid) delete state.picks[agId]; else state.picks[agId] = oid;
    touch(0);
    syncPicks();
    renderList();
  }

  // 안을 바꿔도 확대는 그대로 둔다 (같은 자리를 안끼리 견준다).
  function setOption(oi) {
    if (!cmp || oi === cmp.oi) return;
    const cap = model().st.cap;
    cmp.oi = oi;
    const j = cap ? model().steps.findIndex(s => s.cap === cap) : -1;   // 이름으로 짝을 맞추면 보던 그림 이름을 이어 본다
    if (j >= 0) cmp.step = j;
    paintCompare();
  }

  function stepBy(d) {
    const n = model().steps.length, s = Math.max(0, Math.min(n - 1, cmp.step + d));
    if (s === cmp.step) return;
    cmp.step = s;
    resetZoom(true);
    paintCompare();
  }

  function pickAndNext() {
    const op = cmp.ag.options[cmp.oi];
    if (state.picks[cmp.ag.id] !== op.id) setPick(cmp.ag.id, op.id);
    go(1);
  }

  function route() {
    const ag = agById(decodeURIComponent(location.hash.slice(1)));
    if (ag) {
      if (!cmp || cmp.ag !== ag) openCompare(ag);
      else if (!cmpDlg.open) cmpDlg.showModal();
    } else if (cmpDlg.open) cmpDlg.close();
  }

  function go(step) {
    const i = agendas.findIndex(a => cmp && a.id === cmp.ag.id) + step;
    if (i >= 0 && i < agendas.length) location.hash = '#' + encodeURIComponent(agendas[i].id);
    else cmpDlg.close();
  }

  window.addEventListener('hashchange', route);
  cmpDlg.addEventListener('close', () => {
    const was = cmp && cmp.ag.id;
    cmp = null;
    resetZoom(true);
    cmpDlg.classList.remove('zoomed', 'dragging');
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    flush();
    renderList();
    const card = was && document.querySelector(`.card[data-ag="${CSS.escape(was)}"] .card-head`);
    if (card) card.focus({ preventScroll: false });
  });
  cmpDlg.addEventListener('click', e => {
    if (!cmp) return;
    if (e.target.closest('[data-close]')) return cmpDlg.close();
    const st = e.target.closest('[data-step]');
    if (st) return stepBy(+st.dataset.step);
    const ot = e.target.closest('[data-opt]');
    if (ot) return setOption(+ot.dataset.opt);
    const pk = e.target.closest('[data-pick]');
    if (pk) return setPick(cmp.ag.id, pk.dataset.pick);
    if (e.target.closest('[data-more]')) return setBand(!bandOpen);
  });
  // 다시 그리는 동안 포커스가 잠깐 dialog 밖으로 나갈 수 있어 키는 document 에서 받는다.
  document.addEventListener('keydown', e => {
    if (!cmpDlg.open || !cmp || e.altKey || e.metaKey || e.ctrlKey) return;
    if (e.key === 'Escape' && zoom.s > 1) { e.preventDefault(); resetZoom(); return; }   // 확대 중이면 원래대로만
    if (e.target.closest('textarea, input, select')) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      stepBy(e.key === 'ArrowRight' ? 1 : -1);
    } else if (e.key === 'Enter' && !e.target.closest('button, a')) {
      e.preventDefault();
      pickAndNext();
    } else if (e.key.length === 1 && !e.shiftKey) {
      const j = cmp.ag.options.findIndex(o => o.id.toLowerCase() === e.key.toLowerCase());
      if (j >= 0) { e.preventDefault(); setOption(j); }
    }
  });
  byId('memo').addEventListener('input', e => {
    if (!cmp) return;
    const v = e.target.value;
    if (v.trim()) state.memos[cmp.ag.id] = v; else delete state.memos[cmp.ag.id];
    touch(400);
  });
  byId('cmp-prev').addEventListener('click', () => go(-1));
  byId('cmp-hnext').addEventListener('click', () => go(1));
  byId('cmp-next').addEventListener('click', () => go(1));

  // ---------------------------------------------------------------- 보내기
  function pickLine(ag, op) {
    const dv = decidedOf(ag), notes = [];
    if (op && op.recommended) notes.push('권장안');
    if (dv) notes.push(op && op.id === dv ? '대화에서 정한 안 그대로' : op ? `대화에서 정한 ${dv} 에서 바꿈` : `대화에서 정한 ${dv} 를 풀었다`);
    const tail = notes.length ? ` (${notes.join(', ')})` : '';
    return op ? `   선택: ${op.id}. ${op.title}${tail}` : `   선택: 미정${tail}`;
  }

  function formatMessage() {
    const lines = [`[agenda-picker] 사용자가 안건 선택을 보냈다 (복사해 붙여 넣음)`, `페이지: ${spec.title}`, `폴더: ${cfg.dir}`, ''];
    agendas.forEach((ag, i) => {
      lines.push(`${i + 1}. ${ag.title}  [${ag.id}]`);
      lines.push(pickLine(ag, pickOf(ag)));
      const memo = (state.memos[ag.id] || '').trim();
      if (memo) memo.split('\n').forEach((ln, n) => lines.push((n ? '         ' : '   메모: ') + ln));
    });
    if (state.note.trim()) { lines.push(''); state.note.trim().split('\n').forEach((ln, n) => lines.push((n ? '           ' : '전체 메모: ') + ln)); }
    lines.push('', `결정 ${agendas.filter(pickOf).length}/${agendas.length}`);
    return lines.join('\n');
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* 아래 방식으로 */ }
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  byId('send').addEventListener('click', async () => {
    const undecided = agendas.filter(a => !pickOf(a)).length;
    if (undecided && !confirm(`미정인 안건이 ${undecided}건 있다. 이대로 보낼까?`)) return;
    const btn = byId('send');
    if (serverMode && online) {
      btn.disabled = true;
      clearTimeout(timer); timer = 0;
      const v = ver;
      try {
        const r = await api('POST', '/api/submit', state);
        savedVer = Math.max(savedVer, v); saveErr = null;
        meta = Object.assign({}, meta || {}, { lastSent: r.lastSent, consumed: r.consumed, waiter: r.waiter, via: r.via,
                                               delivery: r.delivery || (meta && meta.delivery) || null });
        if (r.delivery && !r.delivery.ok) toast(`#${r.lastSent.seq} 을 저장했지만 Claude 에 넣지 못했다. ${r.delivery.message}`, true);
        else toast(`#${r.lastSent.seq} 을 Claude 로 보냈다.${r.closeTab ? ' 이 탭을 닫는다.' : ''}`);
      } catch (e) {
        if (!e.status) online = false;
        toast('보내지 못했다: ' + e.message, true);
      } finally {
        btn.disabled = false; setSave(); renderSend();
      }
      return;
    }
    toast(await copyText(formatMessage()) ? '메시지를 복사했다. Claude 세션에 붙여 넣는다.' : '복사하지 못했다', false);
  });

  // ---------------------------------------------------------------- 서버 상태 (2초마다)
  async function poll() {
    try {
      const m = await api('GET', '/api/meta');
      const back = !online;
      online = true; meta = m;
      if (saveErr && !saveErr.status) saveErr = null;
      if ((back || unsaved()) && !timer) flush();
      if (m.specVersion && m.specVersion !== cfg.specVersion && byId('banner').hidden) {
        showBanner('안건 내용이 바뀌었다. 지금 선택은 저장돼 있다. <button type="button" class="btn" data-reload>새로고침</button>');
      }
    } catch (e) {
      if (e.status === 403) saveErr = e; else online = false;
    }
    setSave(); renderSend();
    setTimeout(poll, document.hidden ? 6000 : 2000);
  }

  // ---------------------------------------------------------------- 시작
  renderHead();
  renderList();
  paintTheme();
  setSave();
  route();
  if (seededNow) touch(0);   // 미리 골라 둔 안을 selections.json 에도 남긴다
  if (serverMode) { if (unsaved()) flush(); poll(); }
})();
</script>
</body>
