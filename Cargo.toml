[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]
# 시제품은 따로 빌드한다 (작업공간에 넣지 않는다)
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
thuminal-protocol = { path = "crates/thuminal-protocol" }
thuminal-engine = { path = "crates/thuminal-engine" }
thuminal-engine-ghostty = { path = "crates/thuminal-engine-ghostty" }
thuminal-pty = { path = "crates/thuminal-pty" }
thuminal-pty-portable = { path = "crates/thuminal-pty-portable" }
thuminal-daemon = { path = "crates/thuminal-daemon" }
thuminal-client = { path = "crates/thuminal-client" }
thuminald = { path = "crates/thuminald" }
thuminal-workspace = { path = "crates/thuminal-workspace" }
thuminal-vcs-git = { path = "crates/thuminal-vcs-git" }
# snapshot API 는 crates.io 0.2.2 에 없어 커밋을 고정해 쓴다 (2026-10-19)
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "0ef80413de1326685743378efbfa06d849e041a7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
portable-pty = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
