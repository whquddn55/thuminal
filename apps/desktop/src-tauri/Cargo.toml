[package]
name = "thuminal-desktop"
description = "thuminal 데스크톱 앱의 Tauri 껍데기. 데몬과 화면 사이를 잇기만 한다."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "thuminal_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: 창 안에 자식 웹뷰를 얹는다 (브라우저 칸). devtools: 배포판에서도 브라우저 칸의 개발자 도구를 연다
tauri = { version = "2", features = ["unstable", "devtools"] }
thuminal-client.workspace = true
thuminal-protocol.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
fontdb = "0.24.0"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile.workspace = true
