[package]
name = "thuminal-desktop"
description = "thuminal 데스크톱 앱의 Tauri 껍데기. 데몬과 화면 사이를 잇기만 한다."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "thuminal_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 원격 접속 토큰 · 호스트 id 난수 (OS 난수 API. Windows 에는 /dev/urandom 이 없다)
getrandom = "0.3"
# unstable: 창 안에 자식 웹뷰를 얹는다 (브라우저 칸). devtools: 배포판에서도 브라우저 칸의 개발자 도구를 연다
tauri = { version = "2", features = ["unstable", "devtools"] }
thuminal-client.workspace = true
thuminal-protocol.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
fontdb = "0.24.0"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 터미널 프로그램이 OSC 52 로 보낸 글을 클립보드에 쓴다 (원격 claude 복사)
tauri-plugin-clipboard-manager = "2"
# 앱 업데이트 (update.rs)
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 알림 (notify.rs). mac-notification-sys 는 번들 id 를 바꿔치기해서 쓰지 않는다
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSString", "NSError", "NSGeometry", "NSArray"] }
# 브라우저 칸 웹뷰를 메인 웹뷰 밑에 깔고 마우스를 넘긴다 (browser.rs mac_layer)
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSGraphics", "NSWindow"] }
objc2-user-notifications = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# 브라우저 칸을 GTK 겹침 층에 얹는다 (browser.rs gtk_layer). Tauri 가 쓰는 gtk 와 같은 버전
gtk = "0.18"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# 켜진 앱에 "다음으로 열기" 로 연 파일을 넘긴다 (open_files.rs). macOS 는 RunEvent::Opened 로 받는다
tauri-plugin-single-instance = "2"
# Linux(D-Bus) · Windows(토스트) 알림 (notify.rs). macOS 에서는 쓰지 않는다 (위 mac-notification-sys 와 같은 문제)
notify-rust = "4"

[dev-dependencies]
tempfile.workspace = true
