plugins {
    id "com.android.application"
}

android {
    namespace "dev.thuminal.app"
    compileSdk 35

    defaultConfig {
        applicationId "dev.thuminal.app"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 직접 내려받아 까는 앱이라 디버그 키로 서명한다 (스토어에 올리지 않는다)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // QR 찍기: Google Play 서비스 화면을 빌려 쓴다 (카메라 권한이 필요 없다)
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}
